[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "codex-session-doctor"
version = "0.1.0"
description = "Diagnose and repair local Codex Desktop session history metadata."
readme = "README.md"
requires-python = ">=3.10"
license = {text = "MIT"}
authors = [{name = "ember056"}]
keywords = ["codex", "history", "recovery", "sqlite", "session"]
classifiers = [
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.10",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "License :: OSI Approved :: MIT License",
    "Operating System :: OS Independent",
]

[project.scripts]
codex-session-doctor = "codex_session_doctor.cli:main"

[tool.setuptools.packages.find]
where = ["."]
include = ["codex_session_doctor*"]

